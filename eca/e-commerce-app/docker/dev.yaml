services:
  keycloak:
    image: quay.io/keycloak/keycloak
    container_name: keycloak
    ports:
    - "8080:8080"
    env_file:
    - .keycloak.env
    networks:
    - eca-network
    volumes:
    - ../data/keycloak/realms:/opt/keycloak/data/import
    depends_on:
    - idp-db
    command:
    - start-dev
    - --import-realm

  idp-db:
    image: postgres:18
    container_name: idp-db
    volumes:
    - ../data/idp-db/data:/var/lib/postgresql/18/docker
    ports:
    - "5430:5432"
    env_file:
    - .idp-db.env
    networks:
    - eca-network

  product-db:
    image: postgres:18
    container_name: product-db
    volumes:
    - ../data/product-db/data:/var/lib/postgresql/18/docker
    ports:
    - "5429:5432"
    env_file:
    - .product-db.env
    networks:
    - eca-network

  order-db:
    image: postgres:18
    container_name: order-db
    volumes:
    - ../data/order-db/data:/var/lib/postgresql/18/docker
    ports:
    - "5428:5432"
    env_file:
    - .order-db.env
    networks:
    - eca-network
  
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - ../data/rabbitmq:/var/lib/rabbitmq
    networks:
      - eca-network

  # Kong API Gateway
  kong:
    image: kong:latest
    container_name: kong
    user: "0"
    environment:
      KONG_DATABASE: "off" # DB-less mod
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    volumes:
      - /Users/demet/dev/eca/e-commerce-app/data/kong:/usr/local/kong/declarative
    ports:
      - "8000:8000" # HTTP Proxy
      - "8443:8443" # HTTPS Proxy
      - "8001:8001" # Admin API (Local kullanım için)
    networks:
      - eca-network
    depends_on:
      - keycloak

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin123
  #   ports:
  #     - "5050:80"

networks:
  eca-network:
    driver: bridge
