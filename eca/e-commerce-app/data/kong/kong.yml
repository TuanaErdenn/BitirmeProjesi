_format_version: "3.0"
_transform: true

services:
  - name: keycloak-service
    url: http://keycloak:8080
    routes:
      - name: keycloak-route
        paths:
          - /auth

  # Product API
  - name: product-service
    url: http://product-api:8080
    routes:
      - name: product-api-route
        paths:
          - /api/v1/products
          - /api/v1/categories
        strip_path: false

  # Order API
  - name: order-service
    url: http://order-api:8080
    routes:
      - name: order-api-route
        paths:
          - /api/v1/orders
          - /api/v1/payments
        strip_path: false

  # Inventory API
  - name: inventory-service
    url: http://inventory-api:8080
    routes:
      - name: inventory-api-route
        paths:
          - /api/v1/inventory
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      second: 5
      hour: 10000
      policy: local

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true
